name: resnet_gradcam_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.0.0
  - torchvision=0.15.0
  - torchaudio=2.0.0
  - cudatoolkit=11.7  # 如果使用 GPU；若只用 CPU 可改为 cpuonly
  - matplotlib=3.7.1
  - numpy=1.24.3
  - pandas=2.0.3
  - scikit-learn=1.2.2
  - tqdm=4.65.0
  - pillow=9.5.0
  - seaborn=0.12.2
  - pip
  - pip:
    - tensorboard==2.13.0
    - opencv-python==4.8.0.74
    - albumentations==1.3.1
    - timm==0.9.2